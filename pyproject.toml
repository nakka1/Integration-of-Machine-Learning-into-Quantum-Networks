[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# Project metadata and dependencies
# ---------------------------------------------------------------------------

[project]
name = "quantum-twin"
version = "4.0.0"
description = "Digital Twin of a Quantum Repeater with a predictive admission controller (EdgeLSTM + CS_MSELoss)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Quantum Twin contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "qiskit>=1.0",
    "qiskit-aer>=0.14",
]

[project.optional-dependencies]
# Tree-ensemble baseline (quantum_twin.baselines.XGBoostFidelityModel); every
# other model works without it -- run_model_comparison skips this baseline
# with a printed warning if xgboost is absent.
xgboost = ["xgboost>=2.0"]

# Experiment-tracking backend used by quantum_twin.mlops (see that module's
# docstring). quantum_twin degrades gracefully to its built-in
# experiment_tracking.ExperimentRun (plain CSV/PNG/JSON on disk) if this
# extra is not installed -- mlflow is opt-in, never a hard requirement.
mlflow = ["mlflow>=2.10"]

dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "mypy>=1.8",
    "ruff>=0.4",
]

docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
]

[project.scripts]
# `quantum-twin` on the command line == `python -m quantum_twin.cli`.
quantum-twin = "quantum_twin.cli:cli_entrypoint"

[project.urls]
Repository = "https://github.com/example/quantum-twin"
Documentation = "https://example.github.io/quantum-twin/"

# ---------------------------------------------------------------------------
# Build configuration (src/ layout)
# ---------------------------------------------------------------------------

[tool.hatch.build.targets.wheel]
packages = ["src/quantum_twin"]

[tool.hatch.version]
path = "src/quantum_twin/__init__.py"
pattern = '^__version__ = "(?P<version>[^"]+)"'

# ---------------------------------------------------------------------------
# mypy -- static type checking
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["quantum_twin"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

# Third-party scientific-computing stacks either ship no type stubs at all
# (qiskit, qiskit_aer) or have stubs too incomplete to satisfy `strict` mode
# without constant false positives (torch, sklearn's internals) -- ignoring
# *missing imports* for exactly these libraries keeps the rest of the
# codebase held to the strict standard above instead of silencing mypy
# project-wide.
[[tool.mypy.overrides]]
module = [
    "qiskit.*",
    "qiskit_aer.*",
    "sklearn.*",
    "xgboost.*",
    "mlflow.*",
    "scipy.*",
]
ignore_missing_imports = true

# Test modules exercise the library with deliberately loose/mocked inputs
# (see tests/test_quantum_node_mocked.py) -- requiring full annotation
# rigor there fights the tests rather than the production code.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

# ---------------------------------------------------------------------------
# Ruff -- linting + formatting (replaces Black/isort/Flake8)
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests", "experiments"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear (common bug patterns)
    "UP",  # pyupgrade (modern syntax)
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "RUF", # Ruff-native rules
]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
]

[tool.ruff.lint.per-file-ignores]
# Test files commonly need star-ish fixtures, longer lines in parametrize
# tables, and assert-heavy style that trips a couple of the stricter rules.
"tests/*" = ["N802", "N806"]

[tool.ruff.lint.isort]
known-first-party = ["quantum_twin"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: tests that train real models / run the full quantum simulation loop",
    "mocked: tests that replace qiskit/torch collaborators with unittest.mock doubles",
]

[tool.coverage.run]
source = ["src/quantum_twin"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
